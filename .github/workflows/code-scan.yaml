# Same jobs as canonical/telemetry-ssdlc ssdlc-go-code-scan.yaml (SEC0025).
# This public repository can't call reusable workflows from that internal
# repository.
name: Code Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 0 2 * * MON
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number && format('pr{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0

      - name: Run gosec
        run: gosec -quiet -confidence medium -verbose=text ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
